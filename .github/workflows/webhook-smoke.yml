name: Webhook smoke test

on:
  push:
    branches: [codespaces-demo]

jobs:
  render-webhook-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            body=$(curl -fsS https://automation-engine-demo.onrender.com/api/health || true)
            if [[ "$body" == *'"status":"healthy"'* ]]; then
              echo "Render is healthy"
              exit 0
            fi
            echo "Waiting for Render... attempt $i/30"
            sleep 10
          done
          echo "Render did not become healthy in time"
          exit 1

      - name: Execute real webhook through Render
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST https://automation-engine-demo.onrender.com/api/executions \
            -H 'Content-Type: application/json' \
            --data '{"workflow":"demo","input":{"webhook_url":"https://postman-echo.com/post","webhook_payload":{"source":"automation-engine","test":"codespaces-demo-fixed-v2"}}}')
          echo "Create response: $response"
          execution_id=$(echo "$response" | jq -r '.id')
          [[ -n "$execution_id" && "$execution_id" != "null" ]]

          run_response=$(curl -fsS -X POST "https://automation-engine-demo.onrender.com/api/executions/$execution_id/run" \
            -H 'Content-Type: application/json')
          echo "Run response: $run_response"

          status=$(echo "$run_response" | jq -r '.status')
          verified=$(echo "$run_response" | jq -r '.output.execution.verified // false')
          action=$(echo "$run_response" | jq -r '.output.execution.action // ""')

          [[ "$status" == "succeeded" ]]
          [[ "$verified" == "true" ]]
          [[ "$action" == "webhook" ]]

      - name: Report
        run: echo "Real Render -> HTTPS webhook -> 2xx verification passed"
