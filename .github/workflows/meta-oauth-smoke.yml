name: Meta OAuth smoke test

on:
  push:
    branches: [codespaces-demo]

jobs:
  meta-oauth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Meta OAuth start, callback, and Graph API endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://automation-engine-demo.onrender.com"

          for i in {1..30}; do
            echo "Meta OAuth smoke attempt $i/30"
            health=$(curl -fsS "$base/api/health" || true)
            if [[ "$health" != *'"status":"healthy"'* ]]; then
              echo "Render is not healthy yet"
              sleep 10
              continue
            fi

            headers_file=$(mktemp)
            body_file=$(mktemp)
            http_code=$(curl -sS -D "$headers_file" -o "$body_file" -w '%{http_code}' "$base/api/meta/oauth/start" || true)
            echo "OAuth start HTTP status: $http_code"

            if [[ "$http_code" != "200" ]]; then
              echo "OAuth start endpoint is not ready"
              cat "$body_file"
              sleep 10
              continue
            fi

            cache_control=$(grep -i '^cache-control:' "$headers_file" | tr -d '\r' || true)
            if [[ "$cache_control" != *"no-store"* ]]; then
              echo "Missing no-store cache control header"
              exit 1
            fi

            authorization_url=$(jq -r '.authorization_url // empty' "$body_file")
            if [[ -z "$authorization_url" || "$authorization_url" == "null" ]]; then
              echo "Missing authorization_url"
              cat "$body_file"
              exit 1
            fi

            state=$(python - "$authorization_url" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse

          url = sys.argv[1]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.netloc != "www.facebook.com":
              raise SystemExit("authorization_url is not a Facebook HTTPS URL")
          state = parse_qs(parsed.query).get("state", [""])[0]
          parts = state.split(".")
          if len(parts) != 4 or parts[0] != "v1" or not parts[1].isdigit() or not parts[2] or not parts[3]:
              raise SystemExit("OAuth state does not have the expected signed format")
          print(state)
          PY
          )

            if [[ -z "$state" ]]; then
              echo "Missing OAuth state"
              exit 1
            fi

            body_file_2=$(mktemp)
            http_code_2=$(curl -sS -o "$body_file_2" -w '%{http_code}' "$base/api/meta/oauth/start" || true)
            if [[ "$http_code_2" != "200" ]]; then
              echo "Second OAuth start request failed with HTTP $http_code_2"
              cat "$body_file_2"
              exit 1
            fi
            authorization_url_2=$(jq -r '.authorization_url // empty' "$body_file_2")
            state_2=$(python - "$authorization_url_2" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse
          print(parse_qs(urlparse(sys.argv[1]).query).get("state", [""])[0])
          PY
          )

            if [[ -z "$state_2" || "$state" == "$state_2" ]]; then
              echo "OAuth state was unexpectedly reused"
              exit 1
            fi

            tampered_state="${state}x"
            callback_body=$(mktemp)
            callback_code=$(curl -sS -o "$callback_body" -w '%{http_code}' --get \
              --data-urlencode "code=dummy-code" \
              --data-urlencode "state=$tampered_state" \
              "$base/api/meta/oauth/callback" || true)
            echo "Tampered OAuth callback HTTP status: $callback_code"
            if [[ "$callback_code" != "400" ]]; then
              echo "Tampered OAuth state was not rejected with HTTP 400"
              cat "$callback_body"
              exit 1
            fi
            if ! grep -q 'Invalid or expired Meta OAuth state' "$callback_body"; then
              echo "Tampered OAuth callback returned an unexpected error"
              cat "$callback_body"
              exit 1
            fi

            status_body=$(mktemp)
            status_code=$(curl -sS -o "$status_body" -w '%{http_code}' "$base/api/meta/oauth/status" || true)
            echo "OAuth status HTTP status: $status_code"
            if [[ "$status_code" != "200" ]]; then
              echo "OAuth status endpoint failed"
              cat "$status_body"
              exit 1
            fi
            if ! jq -e '.connected == true and .page_id != null and .page_name != null' "$status_body" >/dev/null; then
              echo "Connected Meta page was not found in persistent OAuth status"
              cat "$status_body"
              exit 1
            fi

            page_body=$(mktemp)
            page_code=$(curl -sS -o "$page_body" -w '%{http_code}' "$base/api/meta/page" || true)
            echo "Meta Graph page info HTTP status: $page_code"
            if [[ "$page_code" != "200" ]]; then
              echo "Meta Graph API page info check failed"
              cat "$page_body"
              exit 1
            fi
            if ! jq -e '.id != null and .name != null' "$page_body" >/dev/null; then
              echo "Meta Graph API returned an unexpected page payload"
              cat "$page_body"
              exit 1
            fi

            echo "Live Meta smoke passed: OAuth state protections, persistent connection, and Meta Graph API page access are all working."
            exit 0
          done

          echo "Meta OAuth smoke did not pass within 5 minutes"
          exit 1
