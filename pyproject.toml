[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
src = ["."]
known-first-party = ["app"]
known-third-party = ["redis"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
